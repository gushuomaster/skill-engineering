sources:
  - source_type: local
    enabled: true
  - source_type: openspace-cloud
    enabled: true
    transport: mcp-stdio
    command:
      - openspace-mcp
      - --transport
      - stdio
    search_tool: search_skills
    source_argument: cloud
    auto_import: false
    download_command:
      - openspace-download-skill
