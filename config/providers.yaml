    optional: false
    availability: packaged
    compatibility:
      status: bundled
    invocation_adapter: codex-exec
    fallback_provider: null
    fallback_equivalence: NONE
    required_capabilities:
      - deliverable_contract_inventory
      - evidence_bound_output_coverage
